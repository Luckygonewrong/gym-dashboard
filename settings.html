<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<header id="nav"></header>
<main class="band">
  <h1>Gym settings</h1>
  <form class="panel pay" id="f" style="max-width:760px">
    <label>Gym ka naam (nav aur WhatsApp message mein dikhega)
      <input id="gym" required maxlength="60" placeholder="e.g. Pulse Fitness, Raja Park">
    </label>
    <div>
      <h2 style="margin:8px 0 10px">Plan fees</h2>
      <div class="plans" id="fees"></div>
      <p class="sub" style="font-size:14px;margin-top:8px">Nayi fees naye members aur agle payment se lagegi. Purane payments nahi badlenge.</p>
    </div>
    <button class="btn red" type="submit" id="save" style="justify-self:start">Settings save karo</button>
  </form>
  <p class="note">Software: Iron House. Har owner ka gym naam aur fees alag rehti hain.</p>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="data.js"></script>
<script>
(async () => {
  const { PLANS, PLAN_NAMES, esc, toast, fail } = G;
  if (!(await G.boot('settings.html'))) return;
  const gym = document.getElementById('gym'), fees = document.getElementById('fees');
  gym.value = G.db.needsSetup ? '' : G.db.gym;
  fees.innerHTML = PLAN_NAMES.map(p => `<label>${p} (₹)<input type="number" inputmode="numeric" min="0" step="1" required data-plan="${p}" value="${PLANS[p].fee}"></label>`).join('');

  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('save'); btn.disabled = true;
    const f = Object.fromEntries([...fees.querySelectorAll('input')].map(i => [i.dataset.plan, Math.round(+i.value)]));
    try {
      await G.saveSettings({ gym: gym.value.trim(), fees: f });
      toast('Settings save ho gayi');
      setTimeout(() => location.reload(), 700);
    } catch (err) { fail(err); btn.disabled = false; }
  });
})();
</script>
</body></html>
