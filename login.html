<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Owner Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1795538549"></head>
<body>
<main class="login">
  <form class="card" id="f">
    <div class="brand" style="font-size:30px"><span class="plates" aria-hidden="true"><i></i><i></i><i></i></span>Iron House Gym</div>
    <p class="sub">Owner dashboard. Sirf owner ke liye.</p>
    <label class="sub" for="u">Email</label>
    <input id="u" type="email" autocomplete="username" required>
    <label class="sub" for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button class="btn red" type="submit" id="go">Login</button>
    <p class="sub" id="err" role="alert" style="color:var(--red);margin:0"></p>
    <p class="note" id="mode" style="margin:0"></p>
  </form>
</main>
<script src="config.js?v=1795538549"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="data.js?v=1795538549"></script>
<script>
(async () => {
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  document.getElementById('mode').textContent = G.ready
    ? 'Account sirf Supabase dashboard se banta hai. Naya signup band hai.'
    : 'Setup adhoora hai: config.js mein Supabase url aur key daalo.';
  if (G.ready && await G.loggedIn()) location.href = 'index.html';

  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Login ho raha hai…';
    try {
      await G.signIn(document.getElementById('u').value.trim(), document.getElementById('p').value);
      location.href = 'index.html';
    } catch (e2) {
      err.textContent = /invalid/i.test(e2?.message || '') ? 'Email ya password galat hai' : (e2?.message || 'Login fail hua');
      go.disabled = false; go.textContent = 'Login';
    }
  });
})();
</script>
</body></html>
