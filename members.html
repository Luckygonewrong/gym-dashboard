<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Members</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1795538549"></head>
<body>
<header id="nav"></header>
<main class="band">
  <h1 id="title">Members</h1>
  <div class="tools">
    <input id="q" type="search" placeholder="Naam ya phone se dhoondo" aria-label="Search members" style="flex:1 1 220px">
    <select id="filter" aria-label="Status filter">
      <option value="">Sab status</option><option value="overdue">Overdue</option><option value="due">Due soon</option><option value="active">Active</option>
    </select>
    <button class="btn red" id="addBtn" type="button" aria-expanded="false" aria-controls="addForm">+ Naya member</button>
  </div>

  <form class="form panel" id="addForm" hidden>
    <label>Naam<input id="fName" required></label>
    <label>Phone (10 digit)<input id="fPhone" inputmode="numeric" pattern="[6-9][0-9]{9}" required></label>
    <label>Plan<select id="fPlan"></select></label>
    <label>Joining date<input id="fJoin" type="date" required></label>
    <p class="sub" id="fNext" style="margin:0;font-size:14px;align-self:center"></p>
    <button class="btn" type="submit">Save member</button>
  </form>

  <div class="tablewrap">
    <table class="stack">
      <thead><tr><th>Naam</th><th>Phone</th><th>Plan</th><th class="num">Fee</th><th>Due date</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script src="config.js?v=1795538549"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="data.js?v=1795538549"></script>
<script>
(async () => {
  const { status, money, esc, nice, dueText, LABEL, PLANS, toast, iso, today, fail } = G;
  if (!(await G.boot('members.html'))) return;
  const q = document.getElementById('q'), filter = document.getElementById('filter');
  const form = document.getElementById('addForm'), addBtn = document.getElementById('addBtn');
  document.getElementById('fPlan').innerHTML = Object.entries(PLANS).map(([k,v]) => `<option value="${k}">${k} · ${money(v.fee)}</option>`).join('');
  const fJoin = document.getElementById('fJoin'), fPlan = document.getElementById('fPlan'), fNext = document.getElementById('fNext');
  fJoin.value = fJoin.max = iso(today);
  // Joining ke din pehli fees mili: agli due = joining date + plan ke din
  const firstDue = () => fJoin.value ? G.addDays(fJoin.value, PLANS[fPlan.value].days) : '';
  const showNext = () => { const d = firstDue(); fNext.textContent = d ? `Agli fees due: ${nice(d)}` : ''; };
  fJoin.addEventListener('input', showNext); fPlan.addEventListener('change', showNext); showNext();

  const render = () => {
    const s = q.value.trim().toLowerCase(), f = filter.value;
    const list = G.db.members
      .filter(m => (!s || m.name.toLowerCase().includes(s) || m.phone.includes(s)) && (!f || status(m) === f))
      .sort((a,b) => a.due.localeCompare(b.due));
    document.getElementById('title').textContent = `Members (${G.db.members.length})`;
    document.getElementById('rows').innerHTML = list.length ? list.map(m => `<tr>
      <td><b>${esc(m.name)}</b></td><td>${esc(m.phone)}</td><td>${esc(m.plan)}</td>
      <td class="num">${money(m.fee)}</td><td>${nice(m.due)} <span class="sub">· ${dueText(m)}</span></td>
      <td><span class="chip ${status(m)}">${LABEL[status(m)]}</span></td>
      <td><button class="btn ghost sm" data-del="${m.id}" type="button">Hatao</button></td></tr>`).join('')
      : '<tr><td colspan="7" class="empty">Koi member nahi mila</td></tr>';
  };

  q.addEventListener('input', render);
  filter.addEventListener('change', render);
  addBtn.addEventListener('click', () => { form.hidden = !form.hidden; addBtn.setAttribute('aria-expanded', !form.hidden); if (!form.hidden) document.getElementById('fName').focus(); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('button'); btn.disabled = true;
    const plan = document.getElementById('fPlan').value;
    try { await G.addMember({ name: document.getElementById('fName').value.trim(), phone: document.getElementById('fPhone').value.trim(), plan, fee: PLANS[plan].fee, due: firstDue() }); }
    catch (err) { fail(err); return; } finally { btn.disabled = false; }
    form.reset(); fJoin.value = iso(today); showNext(); form.hidden = true; addBtn.setAttribute('aria-expanded', 'false');
    render(); toast('Member add ho gaya');
  });
  let pendingDel = null;
  document.getElementById('rows').addEventListener('click', async e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    const id = +b.dataset.del;
    if (pendingDel !== id) { pendingDel = id; b.textContent = 'Pakka?'; b.classList.add('red'); return; }
    pendingDel = null; b.disabled = true;
    try { await G.deleteMember(id); toast('Member hata diya'); } catch (err) { fail(err); }
    render();
  });
  render();
})();
</script>
</body></html>
